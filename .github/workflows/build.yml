name: Build Pocketpad

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Build signed APK
        working-directory: android
        run: |
          chmod +x gradlew
          set -o pipefail
          ./gradlew assembleRelease --no-daemon 2>&1 | tee ../gradle.log
      - name: Show compiler errors
        if: failure()
        run: |
          grep -E '^e: |error:|What went wrong' -A3 gradle.log | head -60 | while IFS= read -r l; do echo "::error::$l"; done
      - name: Rename APK
        run: cp android/app/build/outputs/apk/release/app-release.apk Pocketpad.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Pocketpad-Android
          path: Pocketpad.apk

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Publish single-file exe
        run: >
          dotnet publish windows/Pocketpad.csproj -c Release -r win-x64
          --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -o out
      - name: Download the controller driver (ViGEmBus)
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $rel = Invoke-RestMethod https://api.github.com/repos/nefarius/ViGEmBus/releases/latest -Headers @{ Authorization = "Bearer $env:GH_TOKEN"; 'User-Agent' = 'pocketpad-ci' }
          $asset = $rel.assets | Where-Object { $_.name -like '*.exe' } | Select-Object -First 1
          if (-not $asset) { throw "ViGEmBus installer not found" }
          Invoke-WebRequest $asset.browser_download_url -OutFile installer/ViGEmBus_Setup.exe
      - name: Build installer
        shell: pwsh
        run: |
          choco install innosetup -y --no-progress
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" installer\pocketpad.iss 2>&1 | ForEach-Object { if ($_ -match 'Error') { Write-Host "::error::$_" }; $_ }
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup failed" }
      - uses: actions/upload-artifact@v4
        with:
          name: Pocketpad-Windows
          path: installer/output/Pocketpad-Setup.exe

  release:
    needs: [android, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Pocketpad build ${{ github.run_number }}
          files: |
            dist/Pocketpad.apk
            dist/Pocketpad-Setup.exe
